root_path: '/home/seungchan/indoor-exploration-competition'

# ---- Fixed: identical for every submission (sensing/comm model) ----
# Changing these changes the actual challenge, not just your strategy.
# start_pose: all robots and the base station start at this same single
# point (see main.py). Shipped value is a local-dev placeholder only -
# official scoring uses an undisclosed start position, so try varying
# this locally rather than tuning against just [15,15].

max_steps: 1000
start_pose: [15,15]

lidar_range: 15
num_laser: 2500
pixel_per_meter: 10

comm_range: 15
attenuation_constant: 10
transmitted_power: 20
path_loss_exponent: 3.5
power_threshold: -80

pd_size: 200

# ---- Evaluation axes: varied by us across a known set for official scoring ----
# Not pinned to one value - tune freely for local experimentation, but your
# policy should generalize across these rather than assume one setting.

num_robots: 3       # official scoring covers 2, 3, 4, and 5 robots
environment: 'env3' # official scoring runs across multiple maps (env1-env7 available under test_maps/)

# ---- Strategy parameters: yours to tune ----
# These only shape the *default* behaviors and optional utilities available
# to your policy; irrelevant if you override the corresponding method.

other_traj_threshold: 5
other_intent_threshold: 10

relay_trigger: 'periodic'
relay_period: 200
final_relay: True
relay_transfer: True

# ---- Visualization only: no effect on scoring ----

save_viz: True
viz_comm: True
viz_gt_map: False
viz_freq: 20

viz_video: False
